[package]
name = "rustsync-core"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
rand = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22.1"
aes-gcm = "0.10.3"
toml = "1.1.2"
