[package]
name = "rustsync-cli"
default-run = "rustsync"
version = "0.1.0"
edition = "2024"
description = "Command-line client for encrypted directory synchronization with RustSync"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "filesystem"]

[dependencies]
rustsync-core = { path = "../rustsync-core" }
clap_complete = "4"
clap = { version = "4", features = ["derive"] }
rustsync-protocol = { version = "0.1.0", path = "../rustsync-protocol" }
rustsync-client = { version = "0.1.0", path = "../rustsync-client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
url = "2"
serde_json = "1"
hex = "0.4.3"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
axum = "0.8.9"
rustsync-server = { path = "../rustsync-server" }

[[bin]]
name = "rustsync"
path = "src/bin/rustsync.rs"
