[package]
name = "rustsync-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
rustsync-core = { path = "../rustsync-core" }
clap = { version = "4", features = ["derive"] }
rustsync-protocol = { version = "0.1.0", path = "../rustsync-protocol" }
rustsync-client = { version = "0.1.0", path = "../rustsync-client" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
url = "2"
serde_json = "1"

[dev-dependencies]
hex = "0.4.3"
sha2 = "0.11"
tempfile = "3"
axum = "0.8.9"
rustsync-server = { path = "../rustsync-server" }
