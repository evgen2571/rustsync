[package]
name = "rustsync-server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
fs4 = "0.13.1"
rustsync-protocol = { version = "0.1.0", path = "../rustsync-protocol" }
serde = { version="1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "rt-multi-thread", "macros", "net", "io-util", "sync"] }

[dev-dependencies]
rustsync-client = { path = "../rustsync-client" }
rustsync-core = { path = "../rustsync-core" }
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
