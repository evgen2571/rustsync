[package]
name = "rustsync-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = {version="2.2.0", features = ["rand_core"]}
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
serde_json = "1"
thiserror = "2.0.18"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
