[package]
name = "rustsync-client"
version = "0.1.0"
edition = "2024"

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = {version = "0.13.4", features = ["json"]}
rustsync-protocol = { path = "../rustsync-protocol"}
serde = "1.0.228"
serde_json = "1.0.145"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread"]}
